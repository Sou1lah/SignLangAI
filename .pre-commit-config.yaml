repos:
  - repo: local
    hooks:
      - id: prettier
        name: Prettier
        entry: pnpm exec prettier --check
        language: system
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown]
      - id: ruff
        name: Ruff
        entry: uv run --directory ai ruff check
        language: system
        types: [python]
