<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5FB;--card:#FFFFFF;--ink:#14213D;--mute:#5B6785;--line:#E1E6F2;
  --pri:#2D5BFF;--pri-d:#1B3FC4;--pri-t:#E6ECFF;--hot:#FF6B5B;--sun:#FFC83D;--ok:#14A87E;--ok-t:#DDF6EC;
  --video:#18233F;--on-pri:#fff;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
  --bg:#0E1424;--card:#171F36;--ink:#EEF1FA;--mute:#9AA6C6;--line:#27304D;--pri:#6C8BFF;--pri-d:#4A69E6;--pri-t:#1F2A55;--ok-t:#10372E;--video:#0A0F1E;--on-pri:#0E1424;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;margin:0}
body{height:100%;background:var(--bg);color:var(--ink);font-family:'Lexend',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:430px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
@media(min-width:600px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.top h1{font-size:17px;font-weight:700;flex:1}
.chip{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-weight:600;font-size:13px;background:var(--bg)}
.chip svg{width:16px;height:16px}
.main{flex:1;overflow-y:auto;padding:16px}
.nav{display:flex;background:var(--card);border-top:1px solid var(--line)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:11px;font-weight:500;color:var(--mute)}
.nav button[aria-current="page"]{color:var(--pri);font-weight:700}
h2{font-size:15px;font-weight:700;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.sub{color:var(--mute);font-size:13px}
.btn{display:block;width:100%;padding:13px;border-radius:14px;background:var(--pri);color:var(--on-pri);font-weight:700;text-align:center;box-shadow:0 4px 0 var(--pri-d)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--pri-d)}
.btn.alt{background:var(--card);color:var(--pri);border:1.5px solid var(--line);box-shadow:none}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s}
.quest{margin-bottom:16px}
.unit{margin:18px 0 6px;padding:12px 14px;border-radius:14px;background:var(--pri);color:var(--on-pri)}
.unit b{display:block;font-size:15px}.unit span{font-size:12px;opacity:.85}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 0}
.node{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#fff;box-shadow:0 5px 0 #0B7A5A}
.node.cur{background:var(--pri);box-shadow:0 5px 0 var(--pri-d);outline:5px solid var(--pri-t)}
.node.lock{background:var(--line);color:var(--mute);box-shadow:0 5px 0 var(--mute);opacity:.8}
.node svg{width:28px;height:28px}
.lab{font-size:12px;color:var(--mute);margin-top:-8px}
.sheet{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:5;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}.bar i{transition:none}}
.video{position:relative;aspect-ratio:4/3;background:var(--video);border-radius:18px;display:grid;place-items:center;overflow:hidden}
.video .stage{transition:transform .2s}
.video .cap{position:absolute;left:0;right:0;bottom:0;padding:10px;background:rgba(0,0,0,.55);color:#fff;text-align:center;font-weight:600}
.hand{animation:wave 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wave{50%{transform:rotate(14deg) translateY(-4px)}}
.ctl{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.pill{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:13px;font-weight:600}
.pill[aria-pressed="true"]{background:var(--pri-t);border-color:var(--pri);color:var(--pri)}
.cam{border-radius:18px;aspect-ratio:4/3;background:var(--video);position:relative;display:grid;place-items:center;color:#fff;overflow:hidden}
.cam .dot{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--sun)}
.meter{margin:12px 0}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:8px;border-radius:10px;font-weight:600;font-size:13px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink)}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.thumb{width:56px;height:42px;border-radius:10px;background:var(--video);display:grid;place-items:center;color:#fff;flex:none}
.thumb svg{width:18px;height:18px}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--hot);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.msg{max-width:78%;margin:8px 0;padding:10px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.msg.me{margin-left:auto;background:var(--pri-t);border-color:transparent}
.msg .thumb{width:100%;height:110px}
.msg small{display:block;margin-top:6px;color:var(--mute)}
.compose{display:flex;gap:8px;padding:10px 12px;background:var(--card);border-top:1px solid var(--line);align-items:center}
.compose input{flex:1;padding:11px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;min-width:0}
.ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--pri-t);color:var(--pri);flex:none}
.ic.rec{background:var(--hot);color:#fff}
.rank{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px}
.rank.me{background:var(--pri-t);font-weight:700}
.rank .n{width:24px;text-align:center;font-weight:700;color:var(--mute)}
.zone{font-size:12px;font-weight:600;color:var(--ok);padding:6px 12px}
.zone.d{color:var(--hot)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{text-align:center;padding:12px 6px}.stat b{display:block;font-size:20px}
.set{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
[aria-checked="true"].sw{background:var(--ok)}[aria-checked="true"].sw::after{transform:translateX(18px)}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;z-index:9}

.call{background:var(--video);color:#fff;z-index:7}
.call .sub{color:#9AA6C6}
.callbody{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0;padding-bottom:6px}
.pip{position:absolute;top:10px;right:10px;width:72px;height:56px;border-radius:10px;background:#2A3558;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;gap:2px}
.pip svg{width:18px;height:18px}
.tiles{display:flex;gap:8px;padding:0 12px}
.tl2{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:12px;background:rgba(255,255,255,.08);border:2px solid transparent}
.tl2.host{border-color:var(--sun)}.tl2 small{font-size:11px}
.trp{flex:1;min-height:0;display:flex;flex-direction:column;margin:0 12px;padding:12px;border-radius:16px;background:rgba(255,255,255,.08)}
.tl{flex:1;overflow-y:auto}
.ln{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.ln .sp{font-size:12px;color:var(--sun);font-weight:600}
.ln>div:nth-child(2){font-size:16px;font-weight:500}
.ln .cf{font-size:11px;color:#9AA6C6}
.pill.sm{padding:4px 9px;font-size:12px;background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.pill.sm[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:#fff}
.live{display:flex;align-items:center;gap:6px;padding-top:8px}
.pd{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
@media(prefers-reduced-motion:reduce){.pd{animation:none}}
.fine{font-size:11px;margin-top:6px}
.ctrls{display:flex;justify-content:space-around;padding:10px 8px 14px}
.cb{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:#fff}
.cb svg{width:48px;height:48px;padding:13px;border-radius:50%;background:rgba(255,255,255,.14)}
.cb[aria-pressed="true"] svg{background:var(--pri)}
.cb.end svg{background:var(--hot)}
.tag{padding:3px 9px;border-radius:99px;background:var(--ok-t);color:var(--ok);font-size:11px;font-weight:700;white-space:nowrap}

button.msg{font:inherit;color:inherit;text-align:left;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-touch-callout:none}
.mw{display:flex;flex-direction:column;align-items:flex-start;max-width:82%;margin:8px 0}
.mw.me{margin-left:auto;align-items:flex-end}
.mw .msg{margin:0;max-width:100%}
.mw .vm{width:220px}
.mini{margin-top:4px;font-size:12px;font-weight:600;color:var(--pri);padding:4px 2px;text-decoration:underline}
.mw small.sub{margin-top:2px;max-width:220px}
.signpop{position:absolute;inset:0;background:rgba(10,15,30,.6);display:grid;place-items:center;padding:20px;z-index:8}
.spc{background:var(--card);border-radius:20px;padding:14px;width:100%;max-width:340px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.call .seg{background:rgba(255,255,255,.12);margin:0 0 10px}
.call .seg button{color:#cbd3ea;font-size:12px}
.call .seg button[aria-pressed="true"]{background:var(--pri);color:#fff}
.holdbtn{padding:0 12px;height:44px;border-radius:99px;background:var(--pri-t);color:var(--pri);font-weight:700;font-size:13px;flex:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.demo{display:flex;gap:6px;align-items:center;padding:5px 10px;background:#0A0F1E;color:#cbd3ea;font-size:11px;overflow-x:auto;white-space:nowrap;flex:none}
.demo button{padding:3px 9px;border-radius:99px;border:1px solid #3a4673;font-size:11px;color:#cbd3ea}.demo button[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:#fff}
.hero{display:block;width:100%;text-align:left;border-radius:20px;padding:14px;color:#fff;background:linear-gradient(135deg,#FF8A3D,#FF4D6D);box-shadow:0 5px 0 #C93B55;margin-bottom:14px}
.hero svg{width:24px;height:24px}.wk{display:flex;justify-content:space-between;margin-top:12px}.wk span{display:grid;justify-items:center;gap:4px;font-size:11px;font-weight:600}
.wk i{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center}.wk i.on{background:#fff;color:#FF4D6D}.wk i.td{outline:3px solid #fff;outline-offset:1px}.wk i svg{width:16px;height:16px}
.ub{margin:22px 0 10px;padding:14px;border-radius:18px;color:#fff;display:flex;gap:10px;align-items:center}.ub b{font-size:15px;display:block}.ub span{font-size:12px;opacity:.92}
.path{position:relative;gap:18px}.path::before{content:"";position:absolute;top:20px;bottom:20px;left:50%;border-left:4px dashed var(--line);transform:translateX(-50%)}
.step{position:relative;z-index:1;text-align:center}.step .lab{background:var(--bg);display:inline-block;padding:0 6px;margin-top:4px}
.ring{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;margin:0 auto;background:conic-gradient(var(--ok) var(--p,0%),var(--line) 0)}
.ring.cur{background:conic-gradient(var(--pri) var(--p,35%),var(--line) 0);animation:pulse 1.8s infinite}.ring .node{width:74px;height:74px;border:4px solid var(--bg)}
@keyframes pulse{50%{transform:scale(1.06)}}
.node.gold:not(.lock){background:#FFB020;box-shadow:0 5px 0 #C27A00}
.go{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--pri);border:2px solid var(--line);padding:3px 12px;border-radius:12px;font-weight:700;font-size:12px;animation:bob 1.2s infinite;z-index:2}
@keyframes bob{50%{transform:translate(-50%,-4px)}}
.stars{display:flex;justify-content:center;gap:2px;margin-top:6px}.stars svg{width:16px;height:16px;color:var(--sun)}.stars .off{color:var(--line)}
.scene{border-radius:14px;display:grid;place-items:center;color:rgba(255,255,255,.92);width:100%;object-fit:cover;margin-top:10px}.scene svg{width:64px;height:64px;stroke-width:1.6}
.act{display:flex;gap:2px;align-items:center;margin-top:8px;flex-wrap:wrap}.act button{display:flex;align-items:center;gap:5px;padding:6px 9px;border-radius:99px;font-size:13px;font-weight:600;color:var(--mute)}
.act button svg{width:18px;height:18px}.act button.on{color:var(--hot)}.act button.on svg{fill:currentColor}
.tile{border-radius:18px;padding:14px;color:#fff;text-align:left;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.tile big{font-size:30px;font-weight:700;line-height:1}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.key{aspect-ratio:1;border-radius:14px;background:var(--card);border:1.5px solid var(--line);font-size:22px;font-weight:700;display:grid;place-items:center;box-shadow:0 3px 0 var(--line)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal i{aspect-ratio:1;border-radius:10px;background:var(--line);display:grid;place-items:center;font-style:normal;font-size:11px;color:var(--mute)}.cal i.on{background:#FF8A3D;color:#fff}.cal i.fz{background:#8FD3FF;color:#06364d}.cal i.tdy{outline:2px solid var(--pri)}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}.confetti i{position:absolute;top:-14px;width:8px;height:13px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(700px) rotate(600deg);opacity:.2}}.pop{animation:pop .5s both}@keyframes pop{from{transform:scale(0)}}
@media(prefers-reduced-motion:reduce){.ring.cur,.go,.confetti i,.pop{animation:none}}
.sg{margin:18px 0 6px;font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.lg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 14px}.lg .set:last-child{border-bottom:0}.val{color:var(--mute);font-size:13px;display:flex;align-items:center;gap:4px}.val svg{width:16px;height:16px}
.ta{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-bottom:10px;resize:vertical}
.tag.warn{background:var(--sun);color:#3a2a00}.tag.mute{background:var(--line);color:var(--mute)}.btn.sm{padding:9px;box-shadow:none;font-size:13px}.two{display:flex;gap:8px}.two>*{flex:1}
.post{margin-bottom:12px}.pc{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.bdg{display:grid;justify-items:center;gap:4px;font-size:11px;text-align:center}.bdg i{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--sun);color:#3a2a00}.bdg.off{opacity:.4;filter:grayscale(1)}

/* ===== iOS light glass layer ===== */
:root{--bg:#EAF0FB;--card:rgba(255,255,255,.66);--ink:#0F1B33;--mute:#5A6785;--line:rgba(15,27,51,.09);--pri:#1F6BFF;--pri-d:#1650C9;--pri-t:rgba(31,107,255,.12);--hot:#FF5A4D;--sun:#FFB800;--ok:#22B573;--ok-t:rgba(34,181,115,.14);--video:linear-gradient(145deg,#5B9DFF,#8F7CFF);--dh:30px;--glass:rgba(255,255,255,.58);--glass-b:rgba(255,255,255,.78);--blur:blur(26px) saturate(190%);--sh:0 10px 30px rgba(30,50,100,.10),0 1px 0 rgba(255,255,255,.8) inset;--spring:cubic-bezier(.2,1.2,.3,1);color-scheme:light}
#app{--b1:#C9DBFF;--b2:#E2D6FF;--b3:#CDF2EA}
#app[data-skin=mint]{--pri:#0FA37F;--pri-d:#0B7F62;--pri-t:rgba(15,163,127,.13);--b1:#BFF3E1;--b2:#CFE9FF;--b3:#E4F7C8}
#app[data-skin=sunset]{--pri:#F2553F;--pri-d:#C93E2B;--pri-t:rgba(242,85,63,.12);--b1:#FFD9C7;--b2:#FFE9B8;--b3:#FFC9DA}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,sans-serif;letter-spacing:-.01em;background:#DCE5F6}
button{transition:transform .2s var(--spring),background .2s,opacity .2s}button:active{transform:scale(.96)}
.app{padding-top:var(--dh);background:var(--bg);isolation:isolate}
.app::before{content:"";position:absolute;inset:-20%;z-index:-1;background:radial-gradient(40% 30% at 20% 15%,var(--b1),transparent 70%),radial-gradient(35% 28% at 85% 42%,var(--b2),transparent 70%),radial-gradient(40% 30% at 30% 92%,var(--b3),transparent 70%);animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,3%) scale(1.12)}}
@media(min-width:600px){body{display:grid;place-items:center}.app{width:393px;height:min(852px,96vh);border-radius:52px;border:9px solid #fff;box-shadow:0 40px 90px rgba(30,50,100,.28),0 0 0 1px rgba(15,27,51,.08)}}
.demo{position:absolute;top:0;left:0;right:0;height:var(--dh);z-index:7;background:rgba(15,27,51,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.top{position:absolute;z-index:2;left:0;right:0;top:var(--dh);min-height:58px;padding:10px 16px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid var(--glass-b)}
.top h1{font-size:21px;font-weight:800;letter-spacing:-.025em}
.main{padding:76px 16px 120px}.sheet .main{padding-bottom:36px}#th{padding-bottom:12px}
.sheet{background:linear-gradient(180deg,#F5F8FE,#E6EDFA);animation:none;padding-top:0}
.sheet.call{padding-top:var(--dh)}
.enter>.main{animation:enter .5s var(--spring)}
@keyframes enter{from{opacity:0;translate:0 16px}}
@keyframes sheetin{from{translate:0 44px;scale:.97;opacity:0}}
.enter .sheet{animation:sheetin .55s var(--spring)}
@keyframes rise{from{opacity:0;translate:0 26px;scale:.8}}
.enter .step{animation:rise .6s var(--spring) both;animation-delay:calc(var(--i,0)*70ms)}
.nav{position:absolute;z-index:3;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));padding:6px;border-radius:32px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-b);box-shadow:var(--sh)}
.nav button{border-radius:26px;padding:8px 0 7px}
.nav button[aria-current=page]{color:var(--pri);background:rgba(255,255,255,.9);box-shadow:0 3px 12px rgba(30,50,100,.12);animation:tabpop .5s var(--spring)}
@keyframes tabpop{from{transform:scale(.86)}}
.card,.lg,.chip,.pill,.search,.ta,.key{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-b)}
.card{border-radius:24px;box-shadow:var(--sh)}.lg{border-radius:22px;box-shadow:var(--sh)}
.pill[aria-pressed="true"]{background:var(--pri);border-color:transparent;color:#fff}

.mini{color:var(--pri)}

@keyframes toastin{from{translate:0 20px;scale:.9;opacity:0}}
.signpop{background:rgba(20,33,61,.28);backdrop-filter:blur(10px)}

.peekwrap.open .pk{translate:0 0}.peekwrap.drag .pk{transition:none}

.buy.off{background:rgba(15,27,51,.1);color:var(--mute)}.buy.own{background:var(--ok-t);color:#0E7A50}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}

/* ===== v2: in-flow header, 3D curved path, roles ===== */
.top{position:relative;top:0;flex:none;background:rgba(255,255,255,.74);overflow:hidden;max-height:90px;transition:max-height .35s var(--spring),opacity .25s,padding .35s,border-width .35s}

.rd{fill:none;stroke:rgba(255,255,255,.95);stroke-width:24px;stroke-linecap:round;vector-effect:non-scaling-stroke;filter:drop-shadow(0 10px 8px rgba(30,50,100,.22))}

.enter .rp{animation:draw 1.3s ease-out .3s both}@keyframes draw{from{stroke-dasharray:0 100!important}}
.step{position:absolute;width:96px;margin-left:-48px;transform:rotateX(-16deg);transform-origin:50% 100%}
.p3d .node{width:70px;height:70px;box-shadow:0 7px 0 var(--nd,#139A62),0 16px 20px rgba(30,50,100,.3),0 2px 0 rgba(255,255,255,.6) inset}
.p3d .node.cur{--nd:color-mix(in srgb,var(--pri) 62%,#000);animation:bobn 2.4s ease-in-out infinite}
.p3d .node.lock{--nd:#B7C1D8}.p3d .node.gold:not(.lock){--nd:#C98100}
.p3d .node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--nd,#139A62),0 8px 12px rgba(30,50,100,.25)}
@keyframes bobn{50%{translate:0 -6px}}
.pill[disabled]{opacity:.5}
</style>

<body>
<div class="app" id="app"></div>
<script>
const $=s=>document.querySelector(s);
const P={
home:'<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>',book:'<path d="M4 4h7a3 3 0 013 3v13a2 2 0 00-2-2H4zM20 4h-7a3 3 0 00-3 3v13a2 2 0 012-2h8z"/>',
chat:'<path d="M21 12a8 8 0 01-11.5 7.2L3 21l1.8-6A8 8 0 1121 12z"/>',trophy:'<path d="M8 4h8v6a4 4 0 01-8 0zM8 6H4v2a4 4 0 004 4M16 6h4v2a4 4 0 01-4 4M12 14v4M8 21h8"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/>',fire:'<path d="M12 3c1 4 5 5 5 10a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>',
star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',check:'<path d="M5 12l5 5 9-10"/>',
play:'<path d="M7 4l13 8-13 8z"/>',lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
video:'<rect x="3" y="6" width="13" height="12" rx="3"/><path d="M16 10l5-3v10l-5-3"/>',back:'<path d="M15 5l-7 7 7 7"/>',
send:'<path d="M4 12l16-8-6 16-3-7z"/>',cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
close:'<path d="M6 6l12 12M18 6L6 18"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'};
const ic=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const hand=`<svg class="hand" viewBox="0 0 100 100" style="width:110px;height:110px;stroke:#fff;stroke-width:3"><path d="M30 55V30a5 5 0 0110 0v20M40 50V20a5 5 0 0110 0v30M50 50V22a5 5 0 0110 0v30M60 52V30a5 5 0 0110 0v32c0 18-12 28-26 28-12 0-20-8-24-18l-6-14a5 5 0 018-5l8 9" fill="rgba(255,255,255,.12)"/></svg>`;

const S={tab:'learn',sub:null,xp:340,streak:12,goal:0.6,lesson:null,step:0,speed:1,loop:false,mirror:false,
set:{captions:true,vibe:true,data:false,device:true,lefty:false},lg:'weekly',chat:null,cs:'private',call:null,iv:null,joined:{},lang:'English',tr:true,cm:'s2t',tts:true,hand:false,rec:false,fav:{},q:'',cat:'All',
units:[{t:'Unit 1: First signs',s:'Greetings and basics',l:[['Hello','done'],['Thank you','done'],['Please','cur'],['Sorry','lock'],['Review','lock']]},
{t:'Unit 2: Fingerspelling',s:'Alphabet A to M',l:[['A to F','lock'],['G to M','lock'],['Quiz','lock']]}]};
const BOARD=[['Lina',1280],['Karim',1190],['Sara',1105],['Omar',990],['You',340],['Hana',310],['Adel',255],['Meriem',190]];

function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;$('#app').append(e);setTimeout(()=>e.remove(),1800)}
function go(t){S.peek=false;S.tab=t;S.chat=null;S.sub=null;render()}

function hdr(title,extra=''){return `<header class="top"><h1>${title}</h1>${extra}</header>`}
function openLesson(u,i){S.lesson={u,i,w:S.units[u].l[i][0]};S.step=0;render()}
function openSign(w){S.lesson={u:-1,i:-1,w};S.step=0;render()}
function lessonView(){
 const L=S.lesson,pr=S.step===1,dn=S.step===2;
 const body=dn?`${doneHtml()}<button class="btn" onclick="finish()">Continue</button>`
 :pr?`<div class="cam" id="cam"><span class="sub" style="color:#fff">Camera preview (hand and face tracking)</span></div>
   <div class="meter"><div class="row"><b class="grow">Match confidence</b><b id="cf">0%</b></div><div class="bar"><i id="cb" style="width:0"></i></div><p class="sub" id="fb" style="margin-top:8px">Sign "${L.w}" in front of the camera. Keep both hands and your face in frame.</p></div>
   <button class="btn" onclick="S.step=2;render()">Finish practice</button>`
 :`<div class="video"><div class="stage" id="stage" style="transform:scaleX(${S.mirror?-1:1})">${hand}</div>${S.set.captions?`<div class="cap">${L.w}</div>`:''}</div>
   <div class="ctl"><button class="pill" aria-pressed="${S.speed===.5}" onclick="S.speed=S.speed===.5?1:.5;render()">Slow 0.5x</button><button class="pill" aria-pressed="${S.loop}" onclick="S.loop=!S.loop;render()">Loop</button><button class="pill" aria-pressed="${S.mirror}" onclick="S.mirror=!S.mirror;render()">Mirror</button></div>
   <div class="card" style="margin-bottom:14px"><b>How to sign "${L.w}"</b><p class="sub">Watch the handshape, movement and facial expression. Signer: Deaf instructor.</p></div>
   <button class="btn" onclick="${L.u<0?'closeLesson()':'startPractice()'}">${L.u<0?'Done':'Practice with camera'}</button>`;
 return `<div class="sheet"><header class="top"><button class="ic" style="background:none" aria-label="Close" onclick="closeLesson()">${ic('close')}</button><h1>${L.w}</h1></header><div class="main">${body}</div></div>`}
function closeLesson(){S.lesson=null;render()}
function startPractice(){S.step=1;S.score=0;render();let v=0;const t=setInterval(()=>{if(!$('#cf')){clearInterval(t);return}
 v=Math.min(92,v+Math.random()*14);S.score=v;$('#cf').textContent=Math.round(v)+'%';$('#cb').style.width=v+'%';
 if(v>=92){$('#fb').textContent='Strong match. Try a slightly wider movement for more clarity.';clearInterval(t)}},500);
 const c=$('#cam');for(let k=0;k<12;k++){const d=document.createElement('i');d.className='dot';d.style.left=(30+Math.random()*40)+'%';d.style.top=(25+Math.random()*50)+'%';c.append(d)}}

const LINES={English:['Hello, how are you today?','I am learning sign language.','Can you sign a little slower, please?','Yes, that sign means thank you.'],Arabic:['مرحبا، كيف حالك اليوم؟','أنا أتعلم لغة الإشارة.','هل يمكنك الإشارة ببطء من فضلك؟','نعم، هذه الإشارة تعني شكرا.'],French:["Bonjour, comment allez-vous aujourd'hui ?","J'apprends la langue des signes.","Pouvez-vous signer plus lentement, s'il vous plait ?","Oui, ce signe veut dire merci."]};
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
const SP={English:['Nice to meet you.','Can we start the lesson?','Please repeat that.','See you tomorrow.'],Arabic:['سررت بلقائك.','هل يمكننا بدء الدرس؟','من فضلك أعد ذلك.','أراك غدا.'],French:['Enchante de vous rencontrer.','Pouvons-nous commencer la lecon ?','Repetez, s\'il vous plait.','A demain.']};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gl=t=>t.replace(/[^\p{L}\s']/gu,'').toUpperCase();
function tmsg(t,me){return `<div class="mw ${me?'me':''}"><button class="msg ${me?'me':''}" data-t="${esc(t)}" aria-label="${esc(t)}. Hold to see in sign language." onpointerdown="holdStart(event)" onpointerup="holdEnd()" onpointerleave="holdEnd()" onpointercancel="holdEnd()" oncontextmenu="return false">${esc(t)}</button><button class="mini" onclick="signPop(this.previousElementSibling.dataset.t,true)">Show in sign</button></div>`}
function vmsg(me,dur,txt){return `<div class="mw ${me?'me':''}"><div class="msg vm ${me?'me':''}"><span class="thumb">${ic('play')}</span><small>Video message, ${dur}</small></div><button class="mini" onclick="const n=this.nextElementSibling;n.hidden=!n.hidden">Sign to text</button><small class="sub" ${S.set.captions?'':'hidden'}>Text (AI): ${esc(txt)}</small></div>`}
let ht=null;
function holdStart(e,mode){const t=mode==='input'?$('#mi').value.trim():e.currentTarget.dataset.t;clearTimeout(ht);ht=setTimeout(()=>{if(!t){toast('Type a message first');return}signPop(t,false)},350)}
function holdEnd(){clearTimeout(ht);const p=$('#sp');if(p&&p.dataset.h==='1')p.remove()}
function signPop(t,persist){const o=$('#sp');if(o)o.remove();const w=gl(t).split(/\s+/).filter(Boolean).slice(0,8);const d=document.createElement('div');d.id='sp';d.className='signpop';d.dataset.h=persist?'0':'1';if(!persist)d.style.pointerEvents='none';
 d.innerHTML=`<div class="spc" role="dialog" aria-label="Text to sign language"><div class="row"><b class="grow">Text to sign (AI avatar)</b>${persist?`<button class="ic" aria-label="Close" onclick="document.getElementById('sp').remove()">${ic('close')}</button>`:''}</div><div class="video" style="margin:10px 0">${hand}<div class="cap">${esc(t)}</div></div><div class="chips" style="flex-wrap:wrap">${w.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div><p class="sub" style="margin-top:6px">${persist?'':'Release to close. '}AI sign output can be inaccurate.</p></div>`;$('#app').append(d)}
function speak(t){try{if(!S.tts||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang={English:'en-US',Arabic:'ar',French:'fr-FR'}[S.lang];speechSynthesis.speak(u)}catch(e){}}
function linesHtml(){const C=S.call;if(!S.tr)return '<p class="sub">AI translation is off.</p>';
 if(S.cm==='s2t')return C.lines.map(l=>`<div class="ln"><div class="sp">${C.type==='group'&&l.i%2?'Dr. Samira B. (host)':C.name} (signing)</div><div dir="auto">${LINES[S.lang][l.i]}</div><div class="cf">${l.c}% confidence${S.tts?', spoken aloud':''}</div></div>`).join('')+'<div class="sub live"><i class="pd"></i>Reading sign...</div>';
 return C.sp.map(l=>`<div class="ln"><div class="sp">Speech heard</div><div dir="auto">${SP[S.lang][l.i]}</div><div class="cf">Signed by AI avatar, ${l.c}% confidence</div></div>`).join('')+'<div class="sub live"><i class="pd"></i>Listening to speech...</div>'}
function scrollTl(){const t=$('#tl');if(t)t.scrollTop=t.scrollHeight}
function startCall(type,name){clearInterval(S.iv);S.call={type,name,t:0,lines:[{i:0,c:91}],sp:[{i:0,c:90}]};S.hand=false;S.cm='s2t';render();let n=1,m=1;
 S.iv=setInterval(()=>{if(!S.call){clearInterval(S.iv);return}
  S.call.t++;const tm=$('#ct');if(tm)tm.textContent=fmt(S.call.t);
  if(S.call.t%3===0&&S.tr){
   if(S.cm==='s2t'){const i=n++%4;S.call.lines.push({i,c:84+Math.floor(Math.random()*13)});speak(LINES[S.lang][i])}
   else{const i=m++%4;S.call.sp.push({i,c:84+Math.floor(Math.random()*13)});const vc=$('#vcap');if(vc)vc.textContent='AI avatar signing: '+gl(SP[S.lang][i])}
   const tl=$('#tl');if(tl){tl.innerHTML=linesHtml();scrollTl()}}},1000)}
function endCall(){clearInterval(S.iv);try{speechSynthesis.cancel()}catch(e){}S.call=null;render()}
function setMode(m){S.cm=m;render();scrollTl()}
function callView(){const C=S.call,g=C.type==='group',t2s=S.cm==='t2s';
 const names=[['Dr. Samira B.','Host'],['Amira',''],['Karim',''],['You','']];
 const cap=t2s?'AI avatar signing: '+gl(SP[S.lang][C.sp[C.sp.length-1].i]):(g?'Dr. Samira B. (host)':C.name);

 <div class="two"><button class="btn sm" onclick="S.sheet='add';render()">Add friends</button><button class="btn sm alt" onclick="toast('Edit profile opens in the full version')">Edit profile</button></div>
 ${roleCard()}<button class="card row" style="width:100%;margin-top:14px" onclick="S.sheet='shop';render()"><span style="color:#E08A00">${ic('bag')}</span><span class="grow" style="text-align:left"><b>Shop</b><div class="sub">${S.notes} notes to spend</div></span>${ic('chev')}</button><h2 style="margin:20px 0 10px">Statistics</h2><div class="g2"><button class="card row" onclick="S.sheet='streak';render()"><span style="color:var(--hot)">${icf('fire')}</span><span style="text-align:left"><b style="font-size:18px">${S.streak}</b><div class="sub">Day streak</div></span></button><div class="card row"><span style="color:var(--pri)">${icf('gem')}</span><span><b style="font-size:18px">${S.xp}</b><div class="sub">Notes earned</div></span></div><div class="card row"><span style="color:#B8860B">${icf('star')}</span><span><b style="font-size:18px">${totalStars()}</b><div class="sub">Stars earned</div></span></div><div class="card row"><span style="color:var(--ok)">${ic('trophy')}</span><span><b style="font-size:18px">Sapphire</b><div class="sub">Current league</div></span></div></div>
 <div class="card" style="margin-top:12px"><div class="row"><div class="grow"><b>Streak freeze</b><div class="sub">${S.freeze} available. Protects a missed day.</div></div><button class="pill" ${S.freeze?'':'disabled'} onclick="useFreeze()">Activate</button></div></div>
 <h2 style="margin:20px 0 10px">Achievements</h2><div class="g4">${[['First sign',1],['7 day streak',1],['Fingerspeller',0],['Helper',0]].map(b=>`<div class="bdg ${b[1]?'':'off'}"><i>${icf('star')}</i>${b[0]}</div>`).join('')}</div></div>`}


Object.assign(P,{note:'<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',bag:'<path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 016 0v2"/>'});
function peek(o){S.peek=o;const p=$('#peek');if(p)p.classList.toggle('open',o)}
let dg=null;
function gdown(e){dg={y:e.clientY};e.currentTarget.setPointerCapture(e.pointerId)}
function gmove(e){if(!dg)return;const p=$('#peek');p.classList.add('drag');p.style.setProperty('--dy',Math.min(Math.max(0,e.clientY-dg.y),380)+'px')}
function gup(e){if(!dg)return;const dy=e.clientY-dg.y,p=$('#peek');p.classList.remove('drag');p.style.removeProperty('--dy');dg=null;peek(Math.abs(dy)>6?dy>70:!S.peek)}
function peekView(){const q=[['Earn 50 notes',Math.min(1,(S.xp-340)/50)],['Finish a lesson today',S.today?1:0],['Reach your daily goal',S.goal]];
 return `<div class="peekwrap ${S.peek?'open':''}" id="peek"><div class="scrim" onclick="peek(false)"></div><div class="pk"><button class="hero" aria-label="Open streak details" onclick="peek(false);S.sheet='streak';render()"><div class="row"><span style="width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center">${icf('fire')}</span><div class="grow"><b style="font-size:20px">${S.streak} day streak</b><div style="font-size:12px;opacity:.95">${S.today?'Today is complete. See you tomorrow.':'Finish one lesson today to keep it going.'}</div></div><span class="chip" style="background:rgba(255,255,255,.22);color:#fff;border:0">${ic('snow')}${S.freeze}</span></div>${weekHtml()}</button>
 <div class="pr"><button class="card" onclick="peek(false);S.sheet='shop';render()"><span style="color:#E08A00">${ic('note')}</span><b style="font-size:24px;display:block">${S.notes}</b><span class="sub">Notes. Open shop</span></button><button class="card" onclick="peek(false);S.sheet='ranks';render()"><span style="color:var(--pri)">${ic('trophy')}</span><b style="font-size:24px;display:block">5th</b><span class="sub">Sapphire league</span></button></div>
 <div class="card" style="padding:14px"><div class="row"><b class="grow">Daily quests</b><span class="sub">Sign of the day: <b style="color:var(--ink)">Friend</b></span></div>${q.map(x=>`<div style="margin-top:10px"><div class="row"><span class="grow sub" style="color:var(--ink)">${x[0]}</span><span class="sub">${Math.round(x[1]*100)}%</span></div><div class="bar" style="margin-top:4px"><i style="width:${x[1]*100}%"></i></div></div>`).join('')}${S.boost?'<div class="tag" style="margin-top:12px;display:inline-block">Double notes ready</div>':''}</div>
 <button class="pkx" aria-label="Close today panel" onclick="peek(false)"><i></i></button></div></div>`}
const SHOP={boosts:[['freeze','Streak freeze','Protects your streak for one missed day.',30,'snow','#3FA9FF'],['double','Double notes','2x notes on your next lesson.',40,'note','#FFA800'],['slow','Slow-motion pack','Adds 0.25x playback to every sign.',60,'play','#8A5CF6',1]],looks:[['mint','Mint path','Fresh green accents across the app.',60,'star','#0FA37F',1],['sunset','Sunset path','Warm coral and amber accents.',80,'fire','#FF6B5B',1],['frame','Gold avatar ring','A gold ring around your profile photo.',90,'trophy','#FFB020',1],['rain','Rainbow confetti','Celebrate every lesson in color.',50,'gem','#FF4D8D',1]]};
function shopSheet(){const t=S.shopTab;
 return sheet('Shop',`<div class="bal ${S.bump?'bump':''}"><span class="grow"><div style="font-size:13px;font-weight:600;opacity:.8">Your notes</div><b>${S.notes}</b></span><svg viewBox="0 0 24 24" style="width:56px;height:56px;stroke-width:1.6">${P.note}</svg></div><div class="seg" style="margin:16px 0" role="group">${[['boosts','Boosts'],['looks','Looks']].map(x=>`<button aria-pressed="${t===x[0]}" onclick="S.shopTab='${x[0]}';render()">${x[1]}</button>`).join('')}</div>
 ${SHOP[t].map(it=>{const own=S.own[it[0]],skin=it[0]==='mint'||it[0]==='sunset',can=S.notes>=it[3];
  const b=own?(skin?`<button class="buy ${S.skin===it[0]?'own':''}" onclick="equip('${it[0]}')">${S.skin===it[0]?'Equipped':'Equip'}</button>`:'<button class="buy own" disabled>Owned</button>'):`<button class="buy ${can?'':'off'}" aria-label="Buy ${it[1]} for ${it[3]} notes" onclick="buy('${it[0]}')">${icf('note')}${it[3]}</button>`;
  return `<div class="card item"><span class="it" style="background:${it[5]}">${ic(it[4])}</span><span class="grow"><b>${it[1]}</b><div class="sub">${it[2]}${it[0]==='freeze'?' You have '+S.freeze+'.':''}</div></span>${b}</div>`}).join('')}<p class="sub" style="margin-top:6px">Earn notes by finishing lessons and daily quests. Notes never expire.</p>`)}
function buy(id){const it=[...SHOP.boosts,...SHOP.looks].find(x=>x[0]===id);if(S.notes<it[3]){toast('You need '+(it[3]-S.notes)+' more notes');return}
 S.notes-=it[3];if(id==='freeze')S.freeze++;else if(id==='double')S.boost=true;else{S.own[id]=1;if(id==='mint'||id==='sunset')S.skin=id}
 S.bump=1;render();S.bump=0;toast(id==='double'?'Double notes ready for your next lesson':it[1]+' added')}
function equip(id){S.skin=S.skin===id?'sky':id;render()}

const PERM={student:[],deaf:['verify'],supervisor:['supRoom','moderate','review','pinfree','fixTr'],admin:['supRoom','moderate','review','pinfree','fixTr','users','assign','reports']};
const ABIL={supRoom:'Create supervised rooms',moderate:'Supervise rooms, mute and remove people, remove posts',review:'Review the post queue',pinfree:'Publish posts without review',fixTr:'Correct AI translations for a room',verify:'Verify AI translations as a deaf member',users:'Manage users and roles',assign:'Assign supervisors',reports:'Handle all reports'};
function can(a,r){return (PERM[r||S.role]||[]).includes(a)}
function abil(r){const l=(PERM[r]||[]).map(a=>ABIL[a]);return l.length?l.join('. ')+'.':'Learn, chat, join public rooms, post for review.'}
function roleCard(){const r=ROLES.find(x=>x[0]===S.role);return `<div class="card" style="margin-top:14px"><div class="row"><b class="grow">Account status</b><span class="tag">${r[1]}</span></div><p class="sub" style="margin-top:6px">${abil(S.role)}</p></div>`}
function modCtl(){return `<button class="cb" aria-pressed="${!!S.muteAll}" onclick="S.muteAll=!S.muteAll;render();toast(S.muteAll?'Everyone muted':'Mute lifted')">${ic('lock')}<span>Mute all</span></button><button class="cb" onclick="modPop()">${ic('people')}<span>Manage</span></button>`}
function modPop(){const o=$('#sp');if(o)o.remove();const d=document.createElement('div');d.id='sp';d.className='signpop';d.innerHTML=`<div class="spc" role="dialog" aria-label="Manage participants"><div class="row"><b class="grow">Manage participants</b><button class="ic" aria-label="Close" onclick="document.getElementById('sp').remove()">${ic('close')}</button></div>${['Amira','Karim','Nour'].map((n,i)=>`<div class="li"><span class="avatar" style="background:${['#2D5BFF','#FF6B5B','#8A5CF6'][i]}">${n[0]}</span><b class="grow">${n}</b><button class="pill" onclick="this.textContent='Muted';this.disabled=true">Mute</button><button class="pill" style="color:var(--hot)" onclick="this.closest('.li').remove();toast('${n} removed from the room')">Remove</button></div>`).join('')}<p class="sub" style="margin-top:8px">Only supervisors can mute or remove people.</p></div>`;$('#app').append(d)}
function removeP(id){POSTS.find(x=>x.id===id).st='rejected';render();toast('Post removed, author notified')}
S.users=[['Amira','student'],['Coach Yassine','supervisor'],['Nour','deaf'],['Dr. Samira B.','supervisor'],['Karim','student']];
function cycRole(i){const o=ROLES.map(r=>r[0]),u=S.users[i];u[1]=o[(o.indexOf(u[1])+1)%o.length];render();toast(u[0]+' is now '+ROLES.find(r=>r[0]===u[1])[1])}
function usersSheet(){return sheet('Users and roles',`<div class="card" style="margin-bottom:12px"><div class="sub">Account status decides what each person can do. Tap a status to change it.</div></div><div class="lg">${S.users.map((u,i)=>`<div class="set"><span class="avatar" style="background:${['#2D5BFF','#14A87E','#8A5CF6','#FF6B5B','#E08A00'][i%5]}">${u[0][0]}</span><b class="grow" style="font-weight:600">${u[0]}</b><button class="pill" onclick="cycRole(${i})">${ROLES.find(r=>r[0]===u[1])[1]}</button></div>`).join('')}</div><div class="sg">What each status can do</div>${ROLES.map(r=>`<div class="card" style="margin-bottom:10px"><b>${r[1]}</b><p class="sub">${abil(r[0])}</p></div>`).join('')}`)}
const TABS=[['learn','Learn','home'],['dict','Dictionary','book'],['chat','Chat','chat'],['social','Social','people'],['profile','Profile','user']];
let lastKey='';
function render(){const key=[S.tab,S.chat,S.sheet,S.dc,S.fs,S.cs,!!S.lesson,!!S.call,S.rules!==null].join('|'),m1=document.querySelector('.app>.main'),a1=m1?m1.scrollTop:0,m2=document.querySelector('.sheet .main'),a2=m2?m2.scrollTop:0,A=$('#app');
 A.classList.toggle('enter',key!==lastKey);A.dataset.skin=S.skin;
 const v={learn,dict,chat,social,ranks,profile}[S.tab](),hideNav=S.tab==='chat'&&S.chat!==null;
 A.innerHTML=demoBar()+v+(S.tab==='learn'?peekView():'')+(hideNav?'':`<nav class="nav" aria-label="Main">${TABS.map(t=>`<button ${S.tab===t[0]?'aria-current="page"':''} onclick="go('${t[0]}')">${ic(t[2])}${t[1]}</button>`).join('')}</nav>`)+(S.lesson?lessonView():'')+(S.sheet?sheetView():'')+(S.rules!==null?rulesSheet():'')+(S.call?callView():'');
 document.querySelectorAll('.main').forEach(m=>{let l=m.scrollTop;m.onscroll=()=>{const t=m.scrollTop;if(Math.abs(t-l)<8)return;const h=m.parentNode.querySelector(':scope>.top');if(h)h.classList.toggle('away',t>l&&t>60);l=t}});
 document.querySelectorAll('.hand').forEach(h=>h.style.animationDuration=S.speed===.5?'3.2s':'1.6s');
 if(key===lastKey){const n1=document.querySelector('.app>.main'),n2=document.querySelector('.sheet .main');if(n1)n1.scrollTop=a1;if(n2)n2.scrollTop=a2}
 lastKey=key;document.body.style.fontSize=['15px','17px','19px'][S.opt.txt||0];document.body.style.filter=S.set.contrast?'contrast(1.2)':''}
render();
</script>
